    <!-- PWA Service Worker Registration & Seamless Auto-Update Logic -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              // Check for updates every 30 seconds automatically
              setInterval(() => {
                registration.update().catch(() => {});
              }, 30000);

              // Check for updates when user switches back to tab or launches installed app
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(() => {});
                }
              });

              // Listen for new service worker installation
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Automatically notify the new service worker to activate and reload
                      installingWorker.postMessage({ action: 'skipWaiting' });
                    }
                  };
                }
              };
            })
            .catch((err) => {
              console.warn('SW registration skipped in preview:', err);
            });

          // Reload smoothly when new version takes control
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
